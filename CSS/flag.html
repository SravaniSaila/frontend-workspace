<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            width:300px;
            height: 300px;
            border:2px solid black;
        }
        .orange{
            height:100px;
            background-color:orange;
        }
        .white{
            height:100px;
            background-color:white;
            display:flex;
            justify-content: center;
            align-items: center;
        }
        .green{
            height:100px;
            background-color:green;
        }
        .ashoka{
            width: 96px;
            height:96px;
            border: 2px solid blue;
            border-radius: 50%;
            background-color:blue;
        }
    </style>
</head>
<body>
    <p>To design flag</p>

    <div class="parent">
        <div class="orange"></div>
        <div class="white">
            <div class="ashoka"></div>
        </div>
        <div class="green"></div>
    </div>
</body>
</html>
