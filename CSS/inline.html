<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            background-color: lightblue;
            color: rgb(62, 18, 192);
        }
        h1{
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <!-- Inline CSS -->
    <p style="background-color: antiquewhite; color:rgb(234, 87, 13)" >Welcome to my website!</p>
    
    <!-- Internal CSS -->
     <h1>To demonstarte internal styling</h1>
    <p>Sravani</p>
    <p>This is another paragraph.</p>
    <p>To apply same styles to multiple elements, you can use inline CSS.</p>
</body>
</html>
